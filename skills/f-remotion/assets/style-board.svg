<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">f-remotion V4 visual style board</title>
  <desc id="desc">Four examples showing a Chinese hero title, prerequisite flow, status steps, and boundary cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26313c"/>
      <stop offset="0.55" stop-color="#151a22"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0879d9" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#0879d9" stop-opacity=".03"/>
      <stop offset="1" stop-color="#0879d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .font { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
      .panel { fill: #080b11; fill-opacity: .88; stroke-width: 1.2; rx: 13; filter: url(#shadow); }
      .header { font-size: 16px; font-weight: 900; letter-spacing: 4px; fill: #1d95ff; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 3px; fill: #fff; fill-opacity: .58; }
      .title { font-size: 39px; font-weight: 900; fill: #fff; }
      .copy { font-size: 20px; font-weight: 800; fill: #fff; }
      .small { font-size: 14px; font-weight: 700; fill: #fff; fill-opacity: .66; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="360" fill="#1d95ff" opacity=".035"/>
  <circle cx="760" cy="930" r="420" fill="#ff626b" opacity=".025"/>
  <text x="54" y="55" class="font header" font-size="21">F REMOTION · APPROVED V4 STYLE</text>
  <text x="54" y="82" class="font micro">语义驱动 · 中文优先 · 柔和进入 · 无意外交叠</text>

  <!-- Chinese hero -->
  <g transform="translate(54 112)">
    <rect width="720" height="330" rx="20" fill="#111820" stroke="#ffffff" stroke-opacity=".08"/>
    <rect width="720" height="330" rx="20" fill="url(#blueWash)"/>
    <rect x="28" y="28" width="4" height="46" rx="2" fill="#1d95ff"/>
    <text x="48" y="46" class="font header">内容栏目 · 01</text>
    <text x="48" y="70" class="font copy" font-size="16">开头重点信息</text>
    <text x="48" y="105" class="font micro">一条来自真实内容的补充说明</text>
    <text x="30" y="182" class="font title" font-size="56">核心受众</text>
    <text x="30" y="250" class="font title" font-size="60" fill="#1d95ff">迎来新变化</text>
    <rect x="32" y="279" width="225" height="32" rx="4" fill="#080b11" fill-opacity=".75"/>
    <rect x="32" y="279" width="4" height="32" rx="2" fill="#1d95ff"/>
    <text x="49" y="300" class="font small">状态标签跟随对应台词进入</text>
  </g>

  <!-- Prerequisite flow -->
  <g transform="translate(826 112)">
    <rect width="720" height="330" rx="20" fill="#111820" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="28" y="28" width="4" height="46" rx="2" fill="#1d95ff"/>
    <text x="48" y="46" class="font header">逻辑关系 · 02</text>
    <text x="48" y="70" class="font copy" font-size="16">条件分支</text>
    <rect x="35" y="112" width="465" height="70" class="panel" stroke="#1d95ff"/>
    <rect x="54" y="129" width="4" height="36" rx="2" fill="#1d95ff"/>
    <text x="76" y="154" class="font copy">目标需要满足前置条件</text>
    <line x1="268" y1="182" x2="268" y2="218" stroke="#1d95ff" stroke-width="3"/>
    <line x1="160" y1="218" x2="390" y2="218" stroke="#1d95ff" stroke-width="3"/>
    <line x1="160" y1="218" x2="160" y2="238" stroke="#1d95ff" stroke-width="3"/>
    <line x1="390" y1="218" x2="390" y2="238" stroke="#1d95ff" stroke-width="3"/>
    <rect x="35" y="238" width="245" height="64" class="panel" stroke="#42df82"/>
    <rect x="300" y="238" width="245" height="64" class="panel" stroke="#f1b94d"/>
    <text x="68" y="278" class="font copy">条件 A</text>
    <text x="333" y="278" class="font copy">条件 B</text>
  </g>

  <!-- Status chain -->
  <g transform="translate(54 478)">
    <rect width="720" height="360" rx="20" fill="#111820" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="28" y="28" width="4" height="46" rx="2" fill="#1d95ff"/>
    <text x="48" y="46" class="font header">过程状态 · 03</text>
    <text x="48" y="70" class="font copy" font-size="16">逐步推进与阻断</text>
    <line x1="70" y1="123" x2="70" y2="309" stroke="#1d95ff" stroke-opacity=".58" stroke-width="3"/>
    <g transform="translate(38 102)">
      <rect width="500" height="66" class="panel" stroke="#1d95ff"/>
      <circle cx="32" cy="33" r="19" fill="#1d95ff" fill-opacity=".12" stroke="#1d95ff"/>
      <text x="21" y="39" class="font small" fill="#1d95ff" fill-opacity="1">01</text>
      <text x="69" y="30" class="font copy">第一步：明确目标</text>
      <text x="69" y="51" class="font small">信息在台词说到时进入</text>
    </g>
    <g transform="translate(38 181)">
      <rect width="500" height="66" class="panel" stroke="#42df82"/>
      <circle cx="32" cy="33" r="19" fill="#42df82" fill-opacity=".12" stroke="#42df82"/>
      <text x="21" y="39" class="font small" fill="#42df82" fill-opacity="1">02</text>
      <text x="69" y="30" class="font copy">第二步：状态完成</text>
      <text x="468" y="42" class="font copy" fill="#42df82">✓</text>
    </g>
    <g transform="translate(38 260)">
      <rect width="500" height="66" class="panel" stroke="#ff626b"/>
      <circle cx="32" cy="33" r="19" fill="#ff626b" fill-opacity=".12" stroke="#ff626b"/>
      <text x="21" y="39" class="font small" fill="#ff626b" fill-opacity="1">03</text>
      <text x="69" y="30" class="font copy">第三步：出现阻断</text>
      <text x="469" y="42" class="font copy" fill="#ff626b">×</text>
    </g>
  </g>

  <!-- Boundary and conclusion -->
  <g transform="translate(826 478)">
    <rect width="720" height="360" rx="20" fill="#111820" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="28" y="28" width="4" height="46" rx="2" fill="#1d95ff"/>
    <text x="48" y="46" class="font header">能力边界 · 04</text>
    <text x="48" y="70" class="font copy" font-size="16">限制项与结论</text>
    <text x="36" y="128" class="font title">不支持的内容</text>
    <rect x="36" y="142" width="268" height="3" rx="2" fill="#ff626b"/>
    <rect x="36" y="175" width="210" height="64" class="panel" stroke="#ff626b"/>
    <rect x="264" y="175" width="210" height="64" class="panel" stroke="#ff626b"/>
    <text x="61" y="214" class="font copy" fill="#ff626b">×</text>
    <text x="91" y="214" class="font copy">限制项 A</text>
    <text x="289" y="214" class="font copy" fill="#ff626b">×</text>
    <text x="319" y="214" class="font copy">限制项 B</text>
    <rect x="36" y="263" width="520" height="70" class="panel" stroke="#42df82"/>
    <text x="61" y="307" class="font copy" fill="#42df82">✓</text>
    <text x="98" y="295" class="font copy">最终结论</text>
    <text x="98" y="318" class="font small">用确认卡收束真实判断</text>
  </g>
</svg>
